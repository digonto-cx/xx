{% extends 'base.html' %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-[32px] p-6 sm:p-8 shadow-2xl shadow-rose-200/50 border border-rose-50 text-center">
        <div class="w-12 h-12 mx-auto rounded-full bg-slate-900 text-rose-500 flex items-center justify-center text-xl mb-4 shadow">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-lg font-black text-slate-900 mb-1">অ্যাডমিন সিক্রেট গেট</h2>
        <p class="text-xs text-slate-400 mb-6">সিস্টেমে প্রবেশের জন্য মাস্টার কি প্রদান করুন</p>

        <form action="/admin/login" method="POST" class="space-y-4">
            <div>
                <input type="password" name="admin_key" required placeholder="Master Admin Key" 
                    class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-xs focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] outline-none">
            </div>
            <button type="submit" class="w-full bg-[#E11D48] hover:bg-[#BE123C] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-500/25 text-xs transition active:scale-95">
                এক্সেস ভেরিফাই করুন
            </button>
        </form>
    </div>
</div>
{% endblock %}
