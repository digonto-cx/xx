{% extends 'base.html' %}
{% block content %}
<style>
    /* Card Entry Animation */
    @keyframes card-fade-up {
        from { opacity: 0; transform: translateY(16px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-card-entry {
        animation: card-fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
</style>

<div class="min-h-[82vh] flex flex-col items-center justify-center p-2 sm:p-4">
    
    <!-- Floating Card Container -->
    <div class="w-full max-w-sm bg-white rounded-[32px] p-6 sm:p-8 shadow-2xl shadow-rose-200/50 border border-rose-50/80 flex flex-col relative overflow-hidden animate-card-entry">
        
        <!-- Brand Logo with Circular Border -->
        <div class="flex justify-center mb-2">
            <div class="w-14 h-14 rounded-full border-2 border-rose-300 p-0.5 bg-white shadow-sm flex items-center justify-center overflow-hidden">
                <img src="https://i.ibb.co/1JbqCDHq/Add-Text-10-10-03-15-45.jpg" 
                     alt="MicroEarnX Logo" 
                     class="w-full h-full object-cover rounded-full">
            </div>
        </div>

        <!-- Brand Name with Animated Neon X -->
        <div class="flex items-center justify-center mb-1 select-none">
            <span class="font-black text-slate-900 text-lg tracking-tight">MicroEarn</span>
            <div class="neon-x-wrapper">
                <span class="neon-aura-ring"></span>
                <span class="x-letter-glow">X</span>
            </div>
            <span class="text-amber-500 text-sm ml-1">⚡</span>
        </div>
        
        <p class="text-[11px] text-slate-400 text-center font-medium mb-4">
            টাস্ক সম্পন্ন করে প্রতিদিন নিশ্চিত আয় করুন
        </p>

        <!-- ================= TUTORIAL CTA BANNER ================= -->
        <a href="/tutorial" 
           class="group relative overflow-hidden flex items-center justify-between p-3 bg-gradient-to-r from-blue-600 via-indigo-600 to-rose-600 text-white rounded-2xl shadow-md shadow-indigo-500/20 hover:scale-[1.02] active:scale-95 transition-all duration-300 mb-5">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-xl bg-white/20 flex items-center justify-center text-white text-xs group-hover:rotate-12 transition">
                    <i class="fa-solid fa-play"></i>
                </div>
                <div class="text-left leading-tight">
                    <span class="text-xs font-black block">কাজের ভিডিও টিউটোরিয়াল</span>
                    <span class="text-[9px] text-blue-100 opacity-90">কীভাবে কাজ করবেন তা ১ মিনিটে দেখুন</span>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-xs opacity-75 group-hover:translate-x-1 transition mr-1"></i>
        </a>

        <!-- ================= 1. LOGIN FORM (DEFAULT) ================= -->
        <div id="loginSection" class="transition-opacity duration-300">
            <h3 class="text-sm font-black text-slate-900 mb-3 text-center">
                অ্যাকাউন্টে প্রবেশ করুন
            </h3>

            <form action="/login" method="POST" onsubmit="return validateGmailForm('loginEmail')" class="space-y-3.5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">ইমেইল অ্যাড্রেস</label>
                    <div class="relative">
                        <input type="email" id="loginEmail" name="email" required placeholder="user@gmail.com" 
                            class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                        <i class="fa-regular fa-envelope absolute right-4 top-3 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <input type="password" id="loginPassInput" name="password" required placeholder="••••••••" 
                            class="w-full px-4 py-2.5 pr-10 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                        
                        <!-- Show / Hide Eye Toggle -->
                        <button type="button" onclick="togglePass('loginPassInput', 'loginEyeIcon')" 
                                class="absolute right-3.5 top-2.5 text-slate-400 hover:text-slate-600 transition p-0.5">
                            <i id="loginEyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-[#E11D48] hover:bg-[#BE123C] active:scale-[0.98] transition-all text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-rose-500/25 flex items-center justify-center gap-2 text-xs mt-3">
                    <span>লগইন করুন</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>

            <!-- Switch to Registration -->
            <div class="text-center mt-4 pt-3.5 border-t border-slate-100">
                <p class="text-xs text-slate-500 font-medium">
                    একাউন্ট নেই? 
                    <button onclick="toggleAuth('register')" class="text-[#E11D48] font-extrabold hover:underline ml-1">
                        একাউন্ট খুলুন
                    </button>
                </p>
            </div>
        </div>

        <!-- ================= 2. REGISTRATION FORM ================= -->
        <div id="registerSection" class="hidden transition-opacity duration-300">
            <h3 class="text-sm font-black text-slate-900 mb-3 text-center">
                নতুন অ্যাকাউন্ট খুলুন
            </h3>

            <form action="/register" method="POST" onsubmit="return validateGmailForm('regEmail')" class="space-y-3">
                <input type="hidden" name="device_id">
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">আপনার পূর্ণ নাম</label>
                    <input type="text" name="name" required placeholder="আপনার নাম লিখুন" 
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">ইমেইল অ্যাড্রেস</label>
                    <input type="email" id="regEmail" name="email" required placeholder="user@gmail.com" 
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <input type="password" id="regPassInput" name="password" required placeholder="পাসওয়ার্ড তৈরি করুন" 
                            class="w-full px-4 py-2.5 pr-10 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                        
                        <!-- Show / Hide Eye Toggle -->
                        <button type="button" onclick="togglePass('regPassInput', 'regEyeIcon')" 
                                class="absolute right-3.5 top-2.5 text-slate-400 hover:text-slate-600 transition p-0.5">
                            <i id="regEyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">
                        রেফারেল কোড <span class="text-slate-400 font-normal">(ঐচ্ছিক)</span>
                    </label>
                    <input type="text" name="ref_by" id="refField" placeholder="রেফার কোড থাকলে দিন" 
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                </div>

                <button type="submit" class="w-full bg-[#E11D48] hover:bg-[#BE123C] active:scale-[0.98] transition-all text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-rose-500/25 flex items-center justify-center gap-2 text-xs mt-3">
                    <span>অ্যাকাউন্ট খুলুন</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>

            <!-- Switch to Login -->
            <div class="text-center mt-4 pt-3.5 border-t border-slate-100">
                <p class="text-xs text-slate-500 font-medium">
                    ইতিমধ্যে একাউন্ট আছে? 
                    <button onclick="toggleAuth('login')" class="text-[#E11D48] font-extrabold hover:underline ml-1">
                        লগইন করুন
                    </button>
                </p>
            </div>
        </div>

        <!-- Telegram Helpline Support -->
        <div class="mt-4">
            <a href="https://t.me/micro_earnx" target="_blank" 
                class="w-full bg-white hover:bg-slate-50 border border-slate-200 active:scale-[0.98] transition-all text-slate-700 font-bold py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 text-xs">
                <i class="fa-brands fa-telegram text-sky-500 text-base"></i>
                <span>টেলিগ্রাম হেল্পলাইন সাপোর্ট</span>
            </a>
        </div>

    </div>

</div>

<!-- SCRIPT CONTROLLERS -->
<script>
// 1. Password Visibility Show/Hide Toggle
function togglePass(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-solid fa-eye text-xs text-[#E11D48]";
    } else {
        input.type = "password";
        icon.className = "fa-solid fa-eye-slash text-xs text-slate-400";
    }
}

// 2. Secret @gmail.com Validation (Frontend এ কোথাও বলবে না, শুধু ব্লক করবে)
function validateGmailForm(emailId) {
    const email = document.getElementById(emailId).value.trim().toLowerCase();
    if (!email.endsWith('@gmail.com')) {
        alert("অনুগ্রহ করে একটি সঠিক ও বৈধ ইমেইল অ্যাড্রেস প্রদান করুন!");
        document.getElementById(emailId).focus();
        return false;
    }
    return true;
}

// 3. Auth Switcher
function toggleAuth(type) {
    const loginSection = document.getElementById('loginSection');
    const registerSection = document.getElementById('registerSection');

    if (type === 'register') {
        loginSection.classList.add('hidden');
        registerSection.classList.remove('hidden');
    } else {
        registerSection.classList.add('hidden');
        loginSection.classList.remove('hidden');
    }
}

// 4. Referral URL Auto-Detection (?ref=CODE)
document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
        toggleAuth('register');
        const refInput = document.getElementById('refField');
        if (refInput) refInput.value = refCode;
    }
});
</script>
{% endblock %}
