{% extends 'base.html' %}
{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center p-2 sm:p-4">
    
    <!-- Floating Card -->
    <div class="w-full max-w-sm bg-white rounded-[32px] p-6 sm:p-8 shadow-2xl shadow-rose-200/50 border border-rose-50/80 flex flex-col relative overflow-hidden">
        
        <!-- Brand Logo -->
        <div class="flex justify-center mb-3">
            <img src="https://i.ibb.co.com/nqLnsdd0/Add-Text-10-09-09-21-33.png" 
                 alt="MicroEarnX Logo" 
                 class="h-16 w-auto object-contain drop-shadow-sm">
        </div>
        
        <p class="text-[12px] text-slate-500 text-center font-medium mb-6">
            টাস্ক সম্পন্ন করে প্রতিদিন নিশ্চিত আয় করুন
        </p>

        <!-- ================= 1. LOGIN FORM (DEFAULT) ================= -->
        <div id="loginSection">
            <h3 class="text-base font-extrabold text-slate-900 mb-4 text-center">
                অ্যাকাউন্টে প্রবেশ করুন
            </h3>

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">ইমেইল অ্যাড্রেস</label>
                    <div class="relative">
                        <input type="email" name="email" required placeholder="user@gmail.com" 
                            class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                        <i class="fa-regular fa-envelope absolute right-4 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <input type="password" name="password" required placeholder="••••••••" 
                            class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                        <i class="fa-solid fa-lock absolute right-4 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-[#E11D48] hover:bg-[#BE123C] active:scale-[0.98] transition-all text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-rose-500/25 flex items-center justify-center gap-2 text-sm mt-3">
                    <span>লগইন করুন</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Switch to Registration -->
            <div class="text-center mt-5 pt-4 border-t border-slate-100">
                <p class="text-xs text-slate-500 font-medium">
                    একাউন্ট নেই? 
                    <button onclick="toggleAuth('register')" class="text-[#E11D48] font-extrabold hover:underline ml-1">
                        একাউন্ট খুলুন
                    </button>
                </p>
            </div>
        </div>

        <!-- ================= 2. REGISTRATION FORM ================= -->
        <div id="registerSection" class="hidden">
            <h3 class="text-base font-extrabold text-slate-900 mb-4 text-center">
                নতুন অ্যাকাউন্ট খুলুন
            </h3>

            <form action="/register" method="POST" class="space-y-3.5">
                <input type="hidden" name="device_id">
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">আপনার পূর্ণ নাম</label>
                    <input type="text" name="name" required placeholder="আপনার নাম লিখুন" 
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">ইমেইল অ্যাড্রেস</label>
                    <input type="email" name="email" required placeholder="user@gmail.com" 
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">পাসওয়ার্ড</label>
                    <input type="password" name="password" required placeholder="পাসওয়ার্ড তৈরি করুন" 
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">
                        রেফারেল কোড <span class="text-slate-400 font-normal">(ঐচ্ছিক)</span>
                    </label>
                    <input type="text" name="ref_by" id="refField" placeholder="রেফার কোড থাকলে দিন" 
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-[#E11D48] transition bg-slate-50/30">
                </div>

                <button type="submit" class="w-full bg-[#E11D48] hover:bg-[#BE123C] active:scale-[0.98] transition-all text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-rose-500/25 flex items-center justify-center gap-2 text-sm mt-3">
                    <span>অ্যাকাউন্ট খুলুন</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Switch to Login -->
            <div class="text-center mt-5 pt-4 border-t border-slate-100">
                <p class="text-xs text-slate-500 font-medium">
                    ইতিমধ্যে একাউন্ট আছে? 
                    <button onclick="toggleAuth('login')" class="text-[#E11D48] font-extrabold hover:underline ml-1">
                        লগইন করুন
                    </button>
                </p>
            </div>
        </div>

        <!-- Telegram Helpline Support -->
        <div class="mt-4">
            <a href="https://t.me/your_support_channel" target="_blank" 
                class="w-full bg-white hover:bg-slate-50 border border-slate-200 active:scale-[0.98] transition-all text-slate-700 font-bold py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 text-xs">
                <i class="fa-brands fa-telegram text-sky-500 text-base"></i>
                <span>টেলিগ্রাম হেল্পলাইন সাপোর্ট</span>
            </a>
        </div>

    </div>

</div>

<!-- Switching Logic & Referral Auto-Detection Script -->
<script>
function toggleAuth(type) {
    const loginSection = document.getElementById('loginSection');
    const registerSection = document.getElementById('registerSection');

    if (type === 'register') {
        loginSection.classList.add('hidden');
        registerSection.classList.remove('hidden');
    } else {
        registerSection.classList.add('hidden');
        loginSection.classList.remove('hidden');
    }
}

// Auto-detect referral link (?ref=CODE) and open signup directly
document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    
    if (refCode) {
        toggleAuth('register');
        const refInput = document.getElementById('refField');
        if (refInput) {
            refInput.value = refCode;
        }
    }
});
</script>
{% endblock %}
